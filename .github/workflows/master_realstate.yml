# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - realstate

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build: 
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Composer install
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Fix line endings
        run: sed -i 's/\r$//' startup.sh default

      - name: Zip app
        run: zip -r release.zip . -x ".git/*" "tests/*" "*.sql" "node_modules/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4F58CD5CE501439A807FA37F948B6A41 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_694F8755A62C4D0BAF6DE95681A25A7D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_86D774B26C5E4F4A8B7B2CCE2008A059 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'realstate'
          slot-name: 'Production'
          package: release.zip
          